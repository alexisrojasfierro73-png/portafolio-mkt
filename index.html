<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Tarjeta de Presentación</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tipografía Google Fonts (Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- CONTENEDOR CENTRAL (TARJETA) -->
    <main class="card">

        <!-- Menú de navegación -->
        <nav class="card-nav">
            <ul>
                <li><a href="#inicio" class="active">Inicio</a></li>
                <li><a href="#proyectos">Proyectos</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>

        <!-- Tu imagen/avatar (DiceBear SVG) -->
        <div class="avatar-container">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Johana" alt="Foto de perfil de Yobi Rojas"
                class="card-avatar" width="120" height="120">
        </div>

        <!-- Nombre y descripción profesional -->
        <h1 class="card-name">Yobi Rojas</h1>
        <p class="card-title">Estrategia Digital & Desarrollo Web</p>

        <!-- Línea decorativa -->
        <hr class="card-divider">

        <!-- Párrafo de biografía -->
        <p class="card-bio">
            Apasionado por el desarrollo de proyectos digitales, con enfoque en marketing digital, diseño UX/UI y
            creación de soluciones creativas para la web.
        </p>

        <!-- Enlaces a tus redes sociales -->
        <div class="card-socials">
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="btn-social">GitHub</a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="btn-social">LinkedIn</a>
        </div>

    </main>

</body>

</html>
